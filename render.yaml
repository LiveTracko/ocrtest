# One-click Render blueprint — import this repo, Render reads this file.
services:
  - type: web
    name: ocrtest
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PDF_RENDER_DPI
        value: 300
      - key: MAX_GEMINI_RETRIES
        value: 3
      - key: ENABLE_SECOND_VERIFICATION
        value: true
